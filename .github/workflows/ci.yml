name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the Core toolchain
        run: curl -fsSL https://raw.githubusercontent.com/snitchbossdotcom/corelang/main/install.sh | bash

      - name: Toolchain version
        run: core version

      - name: Unit tests
        run: core test

      - name: Build the smoke example
        run: |
          cd examples/smoke
          core build

      # Live DNS lookup against the real network. Allowed to fail: CI
      # egress rules vary and this step is a smoke check, not a gate.
      - name: Live resolution smoke test
        run: ./examples/smoke/smoke example.com
        continue-on-error: true
